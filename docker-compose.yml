# 複数のコンテナを定義
services:
    # サービス名
    nginx:
        container_name: "flea-market-nginx"
        # イメージとバージョンを指定
        image: nginx:1.21.1
        ports:
            - "8082:80"
        # ホスト側(PC)とコンテナの紐づけ
        volumes:
            # nginxの設定ファイルをコンテナに反映
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            # srcディレクトリをコンテナに反映
            - ./src:/var/www/
        # phpサービスが起動してからnginxサービスを起動する
        depends_on:
            - php

    php:
        container_name: "flea-market-php"
        # Dockerfileを元にビルド(組み立てる)
        build: ./docker/php
        volumes:
            - ./src:/var/www/

    node:
        image: node:20
        container_name: "flea-market-node"
        #package.jsonのあるディレクトリを作業ディレクトリにする
        working_dir: /var/www/
        volumes:
            - ./src:/var/www/
        # ホスト側(PC)5173ポートとコンテナ5173ポートの紐づけ
        ports:
            - "5173:5173"
        # npmインストール後、Vite開発サーバーの起動(全てのネットワークから接続を受け付ける)
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

    mysql:
        image: mysql:8.0.26
        container_name: "flea-market-db"
        # MySQLの環境変数を設定し自動セットアップ
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: flea_market_db
            MYSQL_USER: flea_market_user
            MYSQL_PASSWORD: flea_market_pass
        # MySQL起動し、認証方式を指定
        command:
            mysqld --default-authentication-plugin=mysql_native_password
        volumes:
            # MySQLのデータ保存場所をホスト側(PC)のディレクトリに共有
            - ./docker/mysql/data_new:/var/lib/mysql
            # MySQLの設定ファイルをホスト側(PC)のディレクトリに共有
            - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf

    phpmyadmin:
        # phpMyAdminのイメージを最新版に指定
        image: phpmyadmin/phpmyadmin:latest
        container_name: "flea-market-phpmyadmin"
        #   phpMyAdminがMySQLに接続するための設定(接続先ホスト・ログイン情報)
        environment:
            - PMA_ARBITRARY=1
            - PMA_HOST=mysql
            - PMA_USER=root
            - PMA_PASSWORD=password
        # ホスト側(PC)8080ポートとコンテナ80ポートの紐づけ
        ports:
            - "8080:80"
        # MySQLサービスが起動してからphpMyAdminサービスを起動する
        depends_on:
            - mysql

    mailpit:
        image: axllent/mailpit:latest
        container_name: "flea-market-mailpit"
        ports:
            - "8025:8025" # ブラウザ表示用
            - "1025:1025" # laravelがメール送信時に使うSMTPポート

    # Stripeからのwebhook通知を、ローカルのnginxコンテナへ自動で転送し続けるコンテナ
    stripe-cli:
        image: stripe/stripe-cli:latest
        container_name: "flea-market-stripe-cli"
        # 最初に実行するプログラムの上書き設定。シェルにコマンドを実行させる
        entrypoint: ["/bin/sh", "-c"]
        # Stripeからのwebhook通知をnginxコンテナへ転送する
        command:
            - 'stripe listen --api-key "$$STRIPE_SECRET_KEY" --forward-to nginx:80/stripe/webhook'
        # 環境変数を.envファイルから読み込む
        env_file:
            - ./src/.env
        depends_on:
            - nginx
